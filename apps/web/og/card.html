<!doctype html>
<!--
  The share card of every page (og:image, src/seo.ts): 1200 × 630, one per locale, in the site's
  "Labo clair" look, without the site's name on it (link previews print it beside the picture), so
  a new name does not call for new cards. A drawing sheet: three products of the catalogue on one
  line, with their real sizes, their photos made by photos.mjs. To make the cards again, from
  apps/web (and give the files a new version: link previews keep a picture by its address):

    for lang in fr en; do
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
        --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 \
        --window-size=1200,630 --virtual-time-budget=3000 \
        --screenshot="$PWD/public/og/default-$lang-v3.png" "file://$PWD/og/card.html?lang=$lang"
    done
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Hubot Sans";
        src: url("../node_modules/@fontsource-variable/hubot-sans/files/hubot-sans-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 200 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      :root {
        --paper: #f3f1ec;
        --ink: #141414;
        --muted: #625e56;
        --signal: #ff5a1f;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background-color: var(--paper);
        /* The canvas's dotted paper. */
        background-image: radial-gradient(circle, rgba(20, 20, 20, 0.16) 1.3px, transparent 1.6px);
        background-size: 28px 28px;
        background-position: 14px 14px;
        color: var(--ink);
        font-family: "Hubot Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(20, 20, 20, 0.22);
      }
      .kicker {
        position: absolute;
        left: 70px;
        top: 64px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Geist Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .kicker::before {
        content: "";
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--signal);
      }
      h1 {
        position: absolute;
        left: 68px;
        top: 104px;
        margin: 0;
        /* Hubot Sans is wider than Inter Tight was: 57 px keeps the French title clear of the monitor. */
        font-size: 57px;
        font-weight: 650;
        line-height: 1;
        letter-spacing: -0.015em;
      }
      .product {
        position: absolute;
        filter: drop-shadow(0 10px 12px rgba(20, 20, 20, 0.12));
      }
      .product img {
        display: block;
        width: 100%;
      }
      /* The monitor's own wallpaper (the maker's advertising) under a plain, switched-off screen. */
      .screen {
        position: absolute;
        left: calc(11 / 1441 * 100%);
        top: calc(11 / 1104 * 100%);
        width: calc(1419 / 1441 * 100%);
        height: calc(803 / 1104 * 100%);
        /* The bezel, over the wallpaper's colours bled into its edge. */
        outline: 1.5px solid #060606;
        background:
          linear-gradient(115deg, rgb(255 255 255 / 0.1), rgb(255 255 255 / 0.03) 38%, transparent 38.2%),
          linear-gradient(160deg, #262626, #121212 70%);
      }
      .baseline {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 518px;
        border-top: 1px solid rgba(20, 20, 20, 0.5);
      }
      .dims {
        position: absolute;
        inset: 0;
      }
      .size {
        position: absolute;
        padding: 0 6px;
        font-family: "Geist Mono", monospace;
        font-size: 14px;
        line-height: 1;
        background: var(--paper);
        translate: -50% -50%;
      }
      .label {
        position: absolute;
        top: 540px;
        display: flex;
        gap: 10px;
        font-family: "Geist Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .label b {
        font-weight: 500;
        color: var(--signal);
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <p class="kicker" data-kicker></p>
    <h1 data-title></h1>

    <!-- On one line, as the home page orders them: a mouse and a keyboard from above, a monitor from the front. -->
    <div class="product" style="left: 70px; top: 318px; width: 100px">
      <img src="photos/logitech-pro-x-superlight-2.webp" alt="" />
    </div>
    <div class="product" style="left: 254px; top: 344px; width: 392px">
      <img src="photos/keychron-q1-he.webp" alt="" />
    </div>
    <div class="product" style="left: 730px; top: 212px; width: 400px">
      <img src="photos/samsung-viewfinity-s9-s90pc-27.webp" alt="" />
      <div class="screen"></div>
    </div>
    <div class="baseline"></div>

    <!-- Their sizes, from data/: the mouse's length, the keyboard's width, the screen's diagonal. -->
    <svg class="dims" width="1200" height="630" viewBox="0 0 1200 630" fill="none" stroke="#141414">
      <path d="M194 318v200M188 318h12M188 518h12" />
      <path d="M254 318h392M254 312v12M646 312v12" />
      <path
        d="M741 430L910.7 337.07M949.3 315.93L1119 223M738.12 424.74l5.76 10.52M1116.12 217.74l5.76 10.52"
        stroke="#f3f1ec"
        stroke-opacity="0.5"
      />
    </svg>
    <span class="size" style="left: 194px; top: 418px; rotate: -90deg">125 mm</span>
    <span class="size" style="left: 450px; top: 318px">328 mm</span>
    <span class="size" style="left: 930px; top: 326.5px; rotate: -28.71deg; background: none; color: var(--paper)">27″</span>

    <div class="label" style="left: 70px"><b>01</b><span data-name="0"></span></div>
    <div class="label" style="left: 254px"><b>02</b><span data-name="1"></span></div>
    <div class="label" style="left: 730px"><b>03</b><span data-name="2"></span></div>

    <script>
      const copy = {
        fr: {
          kicker: "Le bon appareil, en quelques questions",
          title: ["Arrêter de chercher.", "Commencer à choisir."],
          names: ["Souris", "Claviers", "Écrans"],
        },
        en: {
          kicker: "The right device, in a few questions",
          title: ["Stop searching.", "Start choosing."],
          names: ["Mice", "Keyboards", "Monitors"],
        },
      }
      const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr"
      const t = copy[lang]
      document.documentElement.lang = lang
      document.querySelector("[data-kicker]").textContent = t.kicker
      document.querySelector("[data-title]").innerHTML = t.title.join("<br />")
      for (const el of document.querySelectorAll("[data-name]")) el.textContent = t.names[el.dataset.name]
    </script>
  </body>
</html>
