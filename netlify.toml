
[build]
  command = "pnpm --filter @choose/web build"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "24"

# The built scripts, styles and fonts carry a hash of their content in their name
# (/assets/index-ykt2D-s1.js): a new build gives new names, so browsers keep them for a year
# without asking again.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Product photos go through Netlify's image CDN (`/.netlify/images`, see
# apps/web/src/features/product/photo.ts): resized to the size shown and served from our own domain,
# so the browser can cut them out whatever the shop's CDN allows. Only these shops may be fetched.
# The shops whose CDN forbids keeping photos (`private`, `max-age=0`) are relayed by our own route
# (`/api/photo/…`, which marks them as never changing): its allowlist in
# apps/web/src/features/product/hosts.ts must match this one.
[images]
  remote_images = [
    'https://cdn\.shopify\.com/.*',
    'https://assets3\.razerzone\.com/.*',
    'https://medias-p1\.phoenix\.razer\.com/.*',
    'https://assets\.corsair\.com/.*',
    'https://res\.cloudinary\.com/.*',
    'https://resource\.logitech\.com/.*',
    'https://resource\.logitechg\.com/.*',
    'https://images\.ctfassets\.net/.*',
    # Monitors: the brands' own image CDNs.
    'https://images\.samsung\.com/.*',
    'https://www\.lg\.com/content/dam/.*',
    'https://i\.dell\.com/.*',
    'https://fr-store\.msi\.com/cdn/shop/.*',
    'https://cdn\.sanity\.io/.*',
    'https://dlcdnwebimgs\.asus\.com/.*',
    'https://images\.philips\.com/.*',
    'https://image\.benq\.com/.*',
    # Keyboards: Akko's own shop.
    'https://en\.akkogear\.com/wp-content/uploads/.*',
    # Mice and keyboards from brands' own sites outside Shopify: Kensington, Cooler Master, CHERRY
    # XTRFY, Skyloong, Wooting.
    'https://media\.accobrands\.com/.*',
    'https://a\.storyblok\.com/f/281110/.*',
    'https://cherryxtrfy\.com/wp/wp-content/uploads/.*',
    'https://skyloongtech\.com/wp-content/uploads/.*',
    'https://wooting-website\.ams3\.cdn\.digitaloceanspaces\.com/.*',
    # Retailers' copies of a brand's photo, where the brand shows the product only at an angle or
    # in a scene.
    'https://mercular\.s3\.ap-southeast-1\.amazonaws\.com/.*',
    'https://image\.makewebeasy\.net/.*',
    'https://f00\.esfr\.pl/.*',
  ]
