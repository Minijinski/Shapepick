
[build]
  command = "pnpm --filter @choose/web build"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "24"

# The built scripts, styles and fonts carry a hash of their content in their name
# (/assets/index-ykt2D-s1.js): a new build gives new names, so browsers keep them for a year
# without asking again.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Product photos go through Netlify's image CDN (`/.netlify/images`, see
# apps/web/src/features/product/photo.ts): resized to the size shown and served from our own domain,
# so the browser can cut them out whatever the shop's CDN allows. Only these sources may be fetched,
# each down to the account the catalogue's photos live in: on a CDN shared by many customers
# (Shopify, Cloudinary, Sanity, Contentful), a host alone would let anyone's files through. The
# shops whose CDN forbids keeping photos (`private`, `max-age=0`) are relayed by our own route
# (`/api/photo/…`, which marks them as never changing). The list is PHOTO_SOURCES in
# packages/catalog/src/media/hosts.ts, each with `.*` added: a test fails when they differ.
[images]
  remote_images = [
    # Shopify stores, one per line: brands' stores and the retailers some photos come from.
    'https://cdn\.shopify\.com/s/files/1/0012/4957/4961/(files|products)/.*',
    'https://cdn\.shopify\.com/s/files/1/0024/9803/5810/(files|products)/.*',
    'https://cdn\.shopify\.com/s/files/1/0059/0630/1017/(files|products)/.*',
