gateron-low-profile-2-0-red: [Low Profile Gateron Red, Gateron Red Low]
gateron-low-profile-2-0-brown: [Low Profile Gateron Brown, Gateron Brown Low]
gateron-low-profile-2-0-blue: [Low Profile Gateron Blue]
gateron-low-profile-2-0-banana: [Low Profile Gateron Banana]

