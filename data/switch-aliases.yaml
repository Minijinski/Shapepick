# Noms de switchs relevés sur les pages des claviers → la fiche de data/switches.yaml qui les décrit.
# Lu par le résolveur de l'import (packages/ingest/src/switches.ts) avant toute recherche, jamais par le
# site. Un nom s'y compare sans casse, sans accents ni ponctuation, sans « Switch », poids ou montage,
# et dans n'importe quel ordre : « Gateron Mechanical Low Profile Red » = « Low Profile Gateron Red ».
# Inutile d'y mettre un nom qui donne déjà le slug d'une fiche (« Keychron K Pro Red »).

# Keychron, noms des options de ses pages (les K Pro sans la marque, les familles sans « Switch »)
keychron-k-pro-red: [K Pro Red]
keychron-k-pro-brown: [K Pro Brown]
keychron-k-pro-blue: [K Pro Blue]
keychron-k-pro-banana: [K Pro Banana]
keychron-mechanical-red: [Keychron Mechanical Red]
keychron-mechanical-brown: [Keychron Mechanical Brown]
keychron-mechanical-blue: [Keychron Mechanical Blue]
keychron-milk-pom-low-profile-red: [Keychron Milk POM Red]
keychron-milk-pom-low-profile-brown: [Keychron Milk POM Brown]
keychron-milk-pom-low-profile-banana: [Keychron Milk POM Banana]
keychron-low-profile-red: [Keychron low-profile Red]
# Même switch sur les Lemokey L0 HE et L5 HE : https://www.keychron.com/products/keychron-ultra-fast-lime-magnetic-switch ;
# la famille seule vient du nom de l'option du V6 Ultra Hybrid 8K (« Keychron Ultra-Fast Lime Magnetic Switch » : Lime)
keychron-ultra-fast-lime-magnetic: [Lemokey Ultra-fast Lime Magnetic, Keychron Ultra-Fast Lime Magnetic]
# « Low Profile Gateron Mechanical » de Keychron = Gateron Low Profile 2.0 (KS-33), comme le « Gateron Low … Switch 2.0 »
